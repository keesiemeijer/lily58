# Enable mouse emulation behaviors used by the mouse layer.
CONFIG_ZMK_POINTING=y

# The dongle has no display
CONFIG_ZMK_DISPLAY=n

# LED strip showing layer and connection state (WS2812 over SPI)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# LED feedback configuration
CONFIG_ZMK_LED_FEEDBACK=y
CONFIG_ZMK_LED_FEEDBACK_BRIGHTNESS=10
CONFIG_ZMK_LED_FEEDBACK_LAYER_COLORS="800080,00FFFF,00FFFF"

CONFIG_ZMK_LED_FEEDBACK_LAYER_COLORS_PER_LAYER="FF0000,FF7F00,FFFF00,00FF00,0000FF,4B0082,9400D3"
# CONFIG_ZMK_LED_FEEDBACK_LAYER_COLORS_PER_LAYER_LED_COUNT=2
CONFIG_ZMK_LED_FEEDBACK_LAYER_ALWAYS_ON_LAYERS="1"

CONFIG_ZMK_LED_FEEDBACK_BATTERY=y
CONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_LEVEL=80
CONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_REPEAT_MINUTES=10
CONFIG_ZMK_LED_FEEDBACK_BATTERY_WARNING_BLINKS=5