# Enable mouse emulation behaviors used by the mouse layer.
CONFIG_ZMK_POINTING=y

# The dongle has no display
CONFIG_ZMK_DISPLAY=n

# LED strip showing layer and connection state (WS2812 over SPI)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_LED_FEEDBACK=y
CONFIG_ZMK_LED_FEEDBACK_BRIGHTNESS=16
