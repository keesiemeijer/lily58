# Enable mouse emulation behaviors used by the mouse layer.
CONFIG_ZMK_POINTING=y

# The dongle has no display
CONFIG_ZMK_DISPLAY=n

# LED strip showing layer and connection state (WS2812 over SPI)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# LED feedback configuration
CONFIG_ZMK_LED_FEEDBACK=y
CONFIG_ZMK_LED_FEEDBACK_BRIGHTNESS=10
CONFIG_ZMK_LED_FEEDBACK_LAYER_COLORS="00FF00,FFFF00,00FFFF"
CONFIG_ZMK_LED_FEEDBACK_LAYER_ALWAYS_ON_LAYERS="1"


CONFIG_ZMK_LED_FEEDBACK_BATTERY=y
CONFIG_ZMK_LED_FEEDBACK_BATTERY_COLORS="00FF00,FF00FF,FF0000,0000FF"
