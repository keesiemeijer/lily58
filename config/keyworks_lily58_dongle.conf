# Enable mouse emulation behaviors used by the mouse layer.
CONFIG_ZMK_POINTING=y

# The dongle has no display
CONFIG_ZMK_DISPLAY=n

# LED strip showing layer and connection state (WS2812 over SPI)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_SLEEP=y

# LED feedback configuration
CONFIG_ZMK_LED_FEEDBACK=y
CONFIG_ZMK_LED_FEEDBACK_BRIGHTNESS=10
CONFIG_ZMK_LED_FEEDBACK_LAYER_COLORS="800080,00FFFF,00FFFF"

CONFIG_ZMK_LED_FEEDBACK_CONNECTION=y
CONFIG_ZMK_LED_FEEDBACK_BATTERY=y
CONFIG_ZMK_LED_FEEDBACK_STARTUP_DIAGNOSTIC=y
CONFIG_ZMK_LED_FEEDBACK_DISPLAY_OFF=y
CONFIG_ZMK_LED_FEEDBACK_OFF_OVERRIDES="battery_feedback"
CONFIG_ZMK_LED_FEEDBACK_REQUIRED_PERIPHERALS=-1